
services:
  backend:
    build: ./backend
    container_name: mini-soundbox-api
    expose:
      - "5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mini-soundbox-web
    ports:
      - "3000:80"
    depends_on:
      - backend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
